<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="convert your .pdf timetable into an .ics calendar file.">
  <title>happiness</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>happiness</h1>
    <p>Convert a .pdf timetable to an .ics calendar file. It is local, and your data is not shared.</p>

    <section class="converter" aria-labelledby="converter-title">
      <h2 id="converter-title">choose a timetable</h2>

      <label class="drop-zone" id="drop-zone" for="pdf-input" tabindex="0">
        <input id="pdf-input" type="file" accept="application/pdf">
        <span class="drop-title">drop your pdf here</span>
        <span class="drop-subtitle">or browse for a file</span>
        <span class="file-name" id="file-name"></span>
      </label>

      <a class="download-link disabled" id="download-link" href="#" aria-disabled="true">Convert and download</a>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">Loading converter</p>
    <p class="note"><a href="https://github.com/megazvezda/happiness" target="_blank">GitHub</a></p>
  </main>

  <script src="wasm_exec.js"></script>
  <script src="script.js"></script>
</body>
</html>
