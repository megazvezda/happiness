name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build -o public/app.wasm .

      - name: Check static bundle
        run: |
          test -s public/index.html
          test -s public/script.js
          test -s public/style.css
          test -s public/wasm_exec.js
          test -s public/app.wasm

